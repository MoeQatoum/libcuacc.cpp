repos:
  - repo: local
    hooks:
    - id: clang-format
      name: clang-format
      entry: clang-format
      language: system
      types_or: [c++, c, cuda]
      args: [-style=file, -i]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
